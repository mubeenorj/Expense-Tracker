<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Expense Tracker</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        Expense Tracker
      </a>
    </div>
  </nav>

  <div class="container mt-3">

    <div id="alertMessage"></div>

    <div id="loadingSpinner" class="text-center d-none">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

  </div>

  <div class="container mt-4">

    <div class="summary-cards">

      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Total Amount</h5>
          <h3 id="totalAmount">0.00</h3>
        </div>
      </div>

      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Number of Expenses</h5>
          <h3 id="expenseCount">0</h3>
        </div>
      </div>

      <div class="card text-center">
        <div class="card-body">
          <h5 class="card-title">Highest Expense</h5>
          <h3 id="highestExpense">0.00</h3>
        </div>
      </div>

    </div>

  </div>

  <div class="container mt-4">

    <div class="card">
      <div class="card-body">

        <h4 class="card-title mb-3">Add Expense</h4>

        <form id="expenseForm">

          <div class="mb-3">
            <label for="title" class="form-label">Title</label>

            <input
              type="text"
              id="title"
              class="form-control"
              placeholder="Enter expense title"
            >
          </div>

          <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>

            <input
              type="number"
              id="amount"
              class="form-control"
              placeholder="Enter amount"
              step="0.01"
            >
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Category</label>

            <select id="category" class="form-select">

              <option value="">Select category</option>

              <option value="Food">
                Food
              </option>

              <option value="Transport">
                Transport
              </option>

              <option value="Bills">
                Bills
              </option>

              <option value="Entertainment">
                Entertainment
              </option>

              <option value="Other">
                Other
              </option>

            </select>
          </div>

          <div class="mb-3">
            <label for="date" class="form-label">Date</label>

            <input
              type="date"
              id="date"
              class="form-control"
            >
          </div>

          <button type="submit" class="btn btn-primary">
            Add Expense
          </button>

        </form>

      </div>
    </div>

  </div>

  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

      <h4>Expenses</h4>

      <div class="d-flex gap-2">

        <input
          type="text"
          id="titleSearch"
          class="form-control"
          placeholder="Search by title"
        >

        <select id="categoryFilter" class="form-select category-filter">

          <option value="All">
            All Categories
          </option>

          <option value="Food">
            Food
          </option>

          <option value="Transport">
            Transport
          </option>

          <option value="Bills">
            Bills
          </option>

          <option value="Entertainment">
            Entertainment
          </option>

          <option value="Other">
            Other
          </option>

        </select>

      </div>

    </div>

  </div>

  <div class="container mt-4 mb-5">

    <div class="card">
      <div class="card-body">

        <h4 class="card-title mb-3">
          All Expenses
        </h4>

        <div class="table-responsive">

          <table class="table table-hover align-middle">

            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Edit</th>
                <th>Delete</th>
              </tr>
            </thead>

            <tbody id="expensesTableBody">

            </tbody>

          </table>

        </div>

      </div>
    </div>

  </div>

  <div class="modal fade" id="editExpenseModal" tabindex="-1">

    <div class="modal-dialog">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">
            Edit Expense
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>

        </div>

        <div class="modal-body">

          <form id="editExpenseForm">

            <input
              type="hidden"
              id="editId"
            >

            <div class="mb-3">
              <label
                for="editTitle"
                class="form-label"
              >
                Title
              </label>

              <input
                type="text"
                id="editTitle"
                class="form-control"
              >
            </div>

            <div class="mb-3">
              <label
                for="editAmount"
                class="form-label"
              >
                Amount
              </label>

              <input
                type="number"
                id="editAmount"
                class="form-control"
                step="0.01"
              >
            </div>

            <div class="mb-3">
              <label
                for="editCategory"
                class="form-label"
              >
                Category
              </label>

              <select
                id="editCategory"
                class="form-select"
              >

                <option value="Food">
                  Food
                </option>

                <option value="Transport">
                  Transport
                </option>

                <option value="Bills">
                  Bills
                </option>

                <option value="Entertainment">
                  Entertainment
                </option>

                <option value="Other">
                  Other
                </option>

              </select>

            </div>

            <div class="mb-3">

              <label
                for="editDate"
                class="form-label"
              >
                Date
              </label>

              <input
                type="date"
                id="editDate"
                class="form-control"
              >

            </div>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Save Changes
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
